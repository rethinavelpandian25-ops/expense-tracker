<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">₹</div>
        <span>Ledger</span>
      </div>
      <h1>Create your account</h1>
      <p class="auth-sub">Track income and expenses, your data only.</p>

      <div class="error-banner" id="errorBanner"></div>

      <form id="signupForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    setupAuthForm({
      formId: "signupForm",
      endpoint: "/api/signup",
      submitId: "submitBtn",
      submitLabel: "Create account",
      onSuccess: () => { window.location.href = "/dashboard"; }
    });
  </script>
</body>
</html>
