{% from "_forms.html" import password_field %}
<!DOCTYPE html>
<html lang="en" data-theme="purple" data-appearance="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Ledger</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <script>
    // Guest pages (login/signup) aren't tied to an account yet, but if this
    // browser has logged into Ledger before, match its last appearance
    // choice so switching between tabs doesn't feel jarring.
    (function () {
      try {
        var mode = localStorage.getItem("ledger-appearance") || "system";
        var resolved = mode === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        document.documentElement.setAttribute("data-appearance", resolved);
      } catch (err) { /* localStorage unavailable — default light stands */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">₹</div>
        <span>Ledger</span>
      </div>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to see your spending history. You'll stay signed in on this device until you log out.</p>

      <div class="error-banner" id="errorBanner"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username or email</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        {{ password_field("password", "password", "Password", "current-password") }}
        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup_page') }}">Sign up</a></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    setupAuthForm({
      formId: "loginForm",
      endpoint: "/api/login",
      submitId: "submitBtn",
      submitLabel: "Log in",
      onSuccess: () => { window.location.href = "/dashboard"; }
    });
  </script>
</body>
</html>
